[tool.poetry]
name = "desenlance"
version = "0.1.0"
description = "Uma implementação desktop do jogo de palavras Termo (clone do Wordle) com Tkinter e MVC"
authors = ["Joao Anunciacao <joaoanunciacao@gmail.com>"]
readme = "README.md"
packages = [
    { include = "Model" },
    { include = "View" },
    { include = "Controller" },
]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "Old_Archives",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
